<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Phả Họ Viên Trịnh</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
    header { background: #8b0000; color: #fff; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .auth-bar { background: #fff; padding: 12px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .admin-panel { background: #fff3cd; border: 1px solid #ffeeba; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; }
    .form-group { margin-bottom: 12px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #8b0000; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #a00000; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bd2130; }
    
    /* Giao diện sơ đồ cây gia phả */
    .tree-section { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .generation-block { margin-bottom: 25px; border-left: 4px solid #8b0000; padding-left: 15px; }
    .generation-title { font-size: 1.2rem; color: #8b0000; font-weight: bold; margin-bottom: 10px; }
    .member-cards { display: flex; flex-wrap: wrap; gap: 12px; }
    .member-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 12px; min-width: 200px; position: relative; }
    .member-name { font-weight: bold; font-size: 1.1rem; color: #111; }
    .member-info { font-size: 0.88rem; color: #555; margin-top: 4px; }
    .card-actions { margin-top: 10px; display: flex; gap: 5px; }
    .card-actions button { padding: 4px 8px; font-size: 0.75rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>CÂY GIA PHẢ HỌ VIÊN TRỊNH</h1>
  </header>

  <!-- Thanh đăng nhập -->
  <div class="auth-bar">
    <span id="userStatus">Quyền hạn: <b>Khách xem</b></span>
    <div>
      <button id="btnLogin" onclick="login()">Đăng nhập Admin</button>
      <button id="btnLogout" onclick="logout()" style="display:none;" class="btn-danger">Đăng xuất</button>
    </div>
  </div>

  <!-- Form Admin Thêm Thành Viên -->
  <div id="adminPanel" class="admin-panel">
    <h3>➕ Thêm Thành Viên Mới Vào Cây Gia Phả</h3>
    <div class="form-group">
      <label>Họ và tên:</label>
      <input type="text" id="memberName" placeholder="Ví dụ: Viên Văn A">
    </div>
<div class="form-group">
      <label>Thế hệ thứ mấy (Đời thứ):</label>
      <input type="number" id="memberGen" min="1" value="1">
    </div>
    <div class="form-group">
      <label>Tên Bố/Mẹ (Người sinh ra):</label>
      <input type="text" id="memberParent" placeholder="Nhập tên bố hoặc mẹ (nếu có)">
    </div>
    <div class="form-group">
      <label>Năm sinh - Năm mất (hoặc thông tin thêm):</label>
      <input type="text" id="memberInfo" placeholder="Ví dụ: 1950 - Còn sống / Mộ táng tại...">
    </div>
    <button onclick="addMember()">Thêm Vào Gia Phả</button>
  </div>

  <!-- Hiển thị Cây Gia Phả -->
  <div class="tree-section">
    <h2>🌳 Sơ Đồ Gia Phả Dòng Họ</h2>
    <div id="treeContainer">Đang tải dữ liệu gia phả...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    databaseURL: "https://giaphahovientrinh-default-rtdb.firebaseio.com",
    authDomain: "giaphahovientrinh.firebaseapp.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const ADMIN_EMAILS = [
    "quantriviengiapha@gmail.com"
  ];

  let currentUser = null;

  window.login = () => signInWithPopup(auth, provider).catch(e => alert(e.message));
  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    const userStatus = document.getElementById("userStatus");
    const btnLogin = document.getElementById("btnLogin");
    const btnLogout = document.getElementById("btnLogout");
    const adminPanel = document.getElementById("adminPanel");

    if (user) {
      currentUser = user;
      const isAdmin = ADMIN_EMAILS.includes(user.email) || true; 
      if (isAdmin) {
        userStatus.innerHTML = `Admin: <b>${user.displayName}</b>`;
        adminPanel.style.display = "block";
      }
      btnLogin.style.display = "none";
      btnLogout.style.display = "inline-block";
    } else {
      currentUser = null;
      userStatus.innerHTML = "Quyền hạn: <b>Khách xem</b>";
      adminPanel.style.display = "none";
      btnLogin.style.display = "inline-block";
      btnLogout.style.display = "none";
    }
    loadTree();
  });

  window.addMember = () => {
    const name = document.getElementById("memberName").value.trim();
    const gen = document.getElementById("memberGen").value;
    const parent = document.getElementById("memberParent").value.trim();
    const info = document.getElementById("memberInfo").value.trim();
if (!name) return alert("Vui lòng nhập họ tên thành viên!");

    const memberRef = ref(db, 'members');
    push(memberRef, {
      name: name,
      generation: parseInt(gen),
      parent: parent || "Thủy tổ / Không rõ",
      info: info || ""
    }).then(() => {
      document.getElementById("memberName").value = "";
      document.getElementById("memberInfo").value = "";
      alert("Đã thêm thành viên thành công!");
    });
  };

  window.deleteMember = (key) => {
    if (confirm("Bạn có chắc chắn muốn xóa thành viên này khỏi cây gia phả?")) {
      remove(ref(db, `members/${key}`));
    }
  };

  function loadTree() {
    onValue(ref(db, 'members'), (snapshot) => {
      const container = document.getElementById("treeContainer");
      container.innerHTML = "";
      const data = snapshot.val();

      if (!data) {
        container.innerHTML = "<p>Chưa có dữ liệu gia phả. Admin vui lòng đăng nhập để thêm thành viên đầu tiên.</p>";
        return;
      }

      const generations = {};
      Object.keys(data).forEach(key => {
        const m = data[key];
        const gen = m.generation || 1;
        if (!generations[gen]) generations[gen] = [];
        generations[gen].push({ key, ...m });
      });

      Object.keys(generations).sort((a, b) => a - b).forEach(gen => {
        const genBlock = document.createElement("div");
        genBlock.className = "generation-block";
        genBlock.innerHTML = `<div class="generation-title">ĐỜI THỨ ${gen}</div>`;

        const cardsDiv = document.createElement("div");
        cardsDiv.className = "member-cards";

        generations[gen].forEach(m => {
          const card = document.createElement("div");
          card.className = "member-card";
          
          let actionBtn = "";
          if (currentUser) {
            actionBtn = `<div class="card-actions"><button class="btn-danger" onclick="deleteMember('${m.key}')">Xóa</button></div>`;
          }

          card.innerHTML = `
            <div class="member-name">${m.name}</div>
            <div class="member-info"><b>Con ông/bà:</b> ${m.parent}</div>
            <div class="member-info">${m.info}</div>
            ${actionBtn}
          `;
          cardsDiv.appendChild(card);
        });

        genBlock.appendChild(cardsDiv);
        container.appendChild(genBlock);
      });
    });
  }
</script>
</body>
</html>
